# pytest.ini — Pytest Configuration for PR Sentinel Backend

[pytest]
# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Source paths
testpaths = app/tests

# Add project root to Python path
pythonpath = .

# Asyncio mode for pytest-asyncio
asyncio_mode = auto

# Markers for test categorization
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may use test database)
    slow: Slow tests (may take >1 second)
    llm: Tests requiring LLM adapter (use mocks by default)
    github: Tests requiring GitHub API (use mocks by default)

# Coverage options
addopts =
    --verbose
    --strict-markers
    --tb=short
    --cov=app
    --cov-branch
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml
    --cov-fail-under=80
    -ra

# Environment variables for tests
env =
    ENVIRONMENT=test
    DEBUG=true
    JWT_SECRET=test-secret-key-minimum-32-chars-long-for-testing
    CSRF_SECRET=test-csrf-secret-minimum-32-chars-long
    GITHUB_CLIENT_ID=test-client-id
    GITHUB_CLIENT_SECRET=test-client-secret
    GITHUB_APP_TOKEN=test-app-token
    MONGO_URI=mongodb://localhost:27017/pr_sentinel_test
    HOSTED_LLM_KEY=test-llm-key
    USE_MOCK_ADAPTERS=true

# Ignore warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Timeout for tests (prevent hanging)
timeout = 300

# Coverage exclusions
[coverage:run]
omit =
    */tests/*
    */conftest.py
    */__init__.py
    */migrations/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
