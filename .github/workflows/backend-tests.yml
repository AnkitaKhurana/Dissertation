name: Backend Tests

on:
  push:
    branches:
      - main
      - develop
    paths:
      - backend/**
      - .github/workflows/backend-tests.yml
      - .github/workflows/docker-publish.yml
  pull_request:
    paths:
      - backend/**
      - .github/workflows/backend-tests.yml
      - .github/workflows/docker-publish.yml
  workflow_dispatch:

jobs:
  test-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run backend pytest
        run: |
          mkdir -p test-results
          python -m pytest --cov-fail-under=0 --junitxml=test-results/pytest.xml --cov-report=xml:test-results/coverage.xml --cov-report=html:test-results/htmlcov

      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: backend/test-results/pytest.xml
          fail_on_failure: true
          require_tests: true
          detailed_summary: true
          include_passed: true

      - name: Upload pytest artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            backend/test-results/pytest.xml
            backend/test-results/coverage.xml
            backend/test-results/htmlcov
          if-no-files-found: error
