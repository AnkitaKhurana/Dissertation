# docker-compose.dev.yml — PR Sentinel Development Environment
# Run with: docker-compose -f docker-compose.dev.yml up --build

version: '3.9'

services:
  # ============================================================================
  # MongoDB (Database)
  # ============================================================================
  mongo:
    image: mongo:7.0
    container_name: pr-sentinel-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-admin123}
      MONGO_INITDB_DATABASE: pr_sentinel
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
      - ./backend/scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - pr-sentinel-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================================
  # Backend (FastAPI)
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development  # Use development stage for hot reload
    container_name: pr-sentinel-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env  # Backend-specific env file
    environment:
      - MONGO_URI=mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-admin123}@mongo:27017/pr_sentinel?authSource=admin
      - HOST=0.0.0.0
      - PORT=8000
      - ENVIRONMENT=development
      - DEBUG=true
    ports:
      - "8000:8000"
    volumes:
      # Mount source code for hot reload
      - ./backend/app:/app/app:ro
      - ./backend/scripts:/app/scripts:ro
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - pr-sentinel-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

# ============================================================================
# Networks
# ============================================================================
networks:
  pr-sentinel-network:
    driver: bridge
    name: pr-sentinel-network

# ============================================================================
# Volumes
# ============================================================================
volumes:
  mongo_data:
    name: pr-sentinel-mongo-data
